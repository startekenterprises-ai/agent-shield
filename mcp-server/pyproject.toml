[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shield-mcp"
version = "1.0.0"
description = "Stdio MCP server for Agent-Shield: scan what your AI agent reads before it acts (prompt injection, leaked secrets, PII, SSRF-risk URLs) via the hosted Agent-Shield API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StarTek Enterprise Solutions LLC" }]
keywords = ["mcp", "model-context-protocol", "security", "prompt-injection", "agent-safety", "llm-security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
agent-shield-mcp = "agent_shield_mcp.server:main"

[project.urls]
Homepage = "https://agent-shield.startekenterprises.com"
Repository = "https://github.com/startekenterprises-ai/agent-shield"

[tool.setuptools.packages.find]
include = ["agent_shield_mcp*"]
